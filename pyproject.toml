[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gaia-pleiades-member-finder"
version = "1.0.0"
description = "Reproducible Gaia DR3 clustering pipeline for Pleiades kinematic candidate members"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Alison Thomas" }]
keywords = ["astronomy", "gaia", "hdbscan", "machine-learning", "pleiades"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
  "astropy>=7.1,<8",
  "astroquery>=0.4.11,<0.5",
  "joblib>=1.5,<2",
  "matplotlib>=3.10,<4",
  "numpy>=2.1,<3",
  "pandas>=2.2,<4",
  "requests>=2.32,<3",
  "scikit-learn>=1.7,<2",
]

[project.optional-dependencies]
dev = [
  "build>=1.3,<2",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
gaia-pleiades = "gaia_pleiades.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gaia_pleiades"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
